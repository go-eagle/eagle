Name: eagle
Version: 1.0.0
PprofPort: :5555
Mode: debug                 # debug, release, test
# In production, avoid using default secrets.
# Supply a secure secret (at least 32 characters) via the JWT_SECRET or EAGLE_JWT_SECRET environment variable.
JwtSecret: JWT_SECRET
JwtTimeout: 86400
CookieName: jwt-token
SSL: true
CtxDefaultTimeout: 12
CSRF: true
Debug: false
EnableTrace: false
EnablePprof: true

HTTP:
  Addr: :8080
  ReadTimeout: 3s
  WriteTimeout: 3s
GRPC:
  Addr: :9090
  ReadTimeout: 5s
  WriteTimeout: 5s